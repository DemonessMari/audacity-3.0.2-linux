name: Prepare verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v3.0.2-build2
        type: string
      source_run:
        description: Successful build run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audacity-3.0.2-linux-x86_64
          path: release
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Create draft with checksums and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          source_sha=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          (cd release/dist && sha256sum -c SHA256SUMS)
          draft_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft_state" = true ]; then
            gh release upload "$RELEASE_TAG" release/dist/*.AppImage release/dist/*.run release/dist/*.tar.gz release/dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --target "$source_sha" --notes-file RELEASE_NOTES.md
          elif [ "$draft_state" = false ]; then
            echo 'Refusing to replace a published release' >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" release/dist/*.AppImage release/dist/*.run release/dist/*.tar.gz release/dist/SHA256SUMS --draft --target "$source_sha" --title "Audacity 3.0.2 — self-contained Linux build 2" --notes-file RELEASE_NOTES.md
          fi
