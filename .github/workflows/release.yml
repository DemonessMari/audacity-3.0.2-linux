name: Prepare verified release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful build run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audacity-3.0.2-linux-x86_64
          path: release
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Create draft with checksums and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          source_sha=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          (cd release/dist && sha256sum -c SHA256SUMS)
          gh release create v3.0.2-build1 release/dist/*.AppImage release/dist/*.tar.gz release/dist/SHA256SUMS --draft --target "$source_sha" --title 'Audacity 3.0.2 — unofficial Linux build 1' --notes-file RELEASE_NOTES.md
